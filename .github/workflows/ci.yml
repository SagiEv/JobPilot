name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  frontend-tests-and-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: Install Dependencies
        working-directory: ./frontend
        run: npm ci
      - name: Run ESLint
        working-directory: ./frontend
        run: npm run lint
      - name: Run Frontend Unit Tests
        working-directory: ./frontend
        run: npm run test

  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: Install Dependencies
        working-directory: ./backend
        run: npm ci
      - name: Run Backend Unit Tests
        working-directory: ./backend
        run: npm run test:unit
      # Note: We run integration tests in the E2E job below because it requires Supabase DB to be up.

  ai-service-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Dependencies
        working-directory: ./backend/ai_service
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-test.txt
      - name: Run Pytest
        working-directory: ./backend/ai_service
        run: pytest

  e2e-and-integration-tests:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          
      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci
        
      - name: Install Backend Dependencies
        working-directory: ./backend
        run: npm ci
        
      - name: Install Playwright Browsers
        working-directory: ./frontend
        run: npx playwright install --with-deps
        
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest
          
      - name: Start Supabase Local Stack
        run: supabase start
        
      - name: Get Supabase Local Credentials
        working-directory: ./backend
        run: |
          # Supabase local defaults
          echo "PORT=5000" >> .env
          echo "NODE_ENV=test" >> .env
          echo "CORS_ORIGIN=http://127.0.0.1:3000" >> .env
          echo "SUPABASE_URL=http://127.0.0.1:54321" >> .env
          # Standard local service role key for Supabase CLI
          echo "SUPABASE_KEY=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRlZmF1bHQiLCJyb2xlIjoic2VydmljZV9yb2xlIiwiaWF0IjoxNjE2MDM2ODk4LCJleHAiOjE5MzE2MTI4OTh9.3D_h17Q-D_Xy9Q1K7-F13A2c_8uJ-dM3G3rI-x5L2o8" >> .env
          
      - name: Run Backend Integration Tests
        working-directory: ./backend
        run: npm run test:integration
          
      - name: Start Backend for E2E
        working-directory: ./backend
        run: |
          # Start backend in background using development env so it listens on port 5000
          # We export it so dotenv doesn't override it (dotenv skips existing keys)
          export NODE_ENV=development
          npm run start &
          sleep 5
          
      - name: Run Playwright E2E Tests
        working-directory: ./frontend
        run: npm run e2e
        
      - name: Upload Playwright Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 30
